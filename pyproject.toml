[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskguard"
version = "0.1.0"
description = "Card fraud detection with probability scoring, threshold tuning, and SHAP explainability"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fraud-detection", "machine-learning", "xgboost", "shap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
